<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnos y Servicios</title>
  <style>
    :root {
      --acento: #18181b;
      --acento-suave: #f4f4f5;
      --whatsapp: #25D366;
      --whatsapp-hover: #1ebe5d;
      --fondo: #f8f9fa;
      --blanco: #ffffff;
      --texto: #111827;
      --gris: #6b7280;
      --borde: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--fondo); color: var(--texto); padding-bottom: 50px; }

    /* Perfil / Header */
    .profile {
      background: var(--blanco);
      border-bottom: 1px solid var(--borde);
      padding: 28px 16px 22px;
      text-align: center;
    }
    .profile-inner { max-width: 680px; margin: 0 auto; }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--acento);
      margin-bottom: 12px;
      background: #eee;
    }
    .profile h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.5px; }
    .profile-sub { font-size: 0.9rem; color: var(--gris); margin-top: 4px; }

    .quick-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--borde);
      background: var(--fondo);
      color: var(--texto);
      text-decoration: none;
      font-size: 0.83rem;
      font-weight: 600;
    }
    .pill-link.primary {
      background: var(--acento);
      color: var(--blanco);
      border-color: var(--acento);
    }

    .hours-box {
      margin-top: 14px;
      font-size: 0.82rem;
      color: var(--gris);
    }

    /* Contenedor */
    main { max-width: 680px; margin: 0 auto; padding: 18px 16px; }

    /* Categorías */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--blanco);
      border: 1px solid var(--borde);
      color: var(--texto);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn.active {
      background: var(--acento);
      color: var(--blanco);
      border-color: var(--acento);
    }

    /* Lista de servicios */
    .service-list { display: flex; flex-direction: column; gap: 12px; }
    .service-card {
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }
    .service-info { flex: 1; }
    .service-cat {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--gris);
      font-weight: 700;
      margin-bottom: 3px;
    }
    .service-name { font-size: 1.02rem; font-weight: 700; margin-bottom: 4px; }
    .service-desc { font-size: 0.84rem; color: var(--gris); line-height: 1.35; margin-bottom: 8px; }
    .service-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }
    .service-price { font-size: 1.05rem; font-weight: 800; color: var(--texto); }
    .service-time {
      background: var(--acento-suave);
      color: var(--texto);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .btn-book {
      background: var(--acento);
      color: var(--blanco);
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Modal Turno */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 40;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal {
      background: var(--blanco);
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px 18px 0 0;
      padding: 20px;
      position: relative;
    }
    @media (min-width: 640px) { .modal { border-radius: 18px; } }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #f3f4f6;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: 700;
    }

    .modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
    .modal-service-box {
      background: var(--acento-suave);
      padding: 10px 12px;
      border-radius: 10px;
      margin: 10px 0 16px;
      font-size: 0.9rem;
    }
    .field-label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; color: var(--texto); }
    .form-field {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      background: var(--blanco);
    }

    .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .slot-btn {
      padding: 9px 6px;
      border: 1px solid var(--borde);
      background: var(--blanco);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .slot-btn.active { background: var(--acento); color: var(--blanco); border-color: var(--acento); }

    .btn-wsp {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--whatsapp);
      color: var(--blanco);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-wsp:hover { background: var(--whatsapp-hover); }
    .empty-msg { text-align: center; color: var(--gris); padding: 32px 10px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <header class="profile">
    <div class="profile-inner">
      <img id="biz-logo" class="avatar" src="" alt="Logo" />
      <h1 id="biz-name"></h1>
      <p class="profile-sub" id="biz-sub"></p>

      <div class="quick-actions">
        <a id="biz-wsp" class="pill-link primary" href="#" target="_blank">💬 Consultar por WhatsApp</a>
        <a id="biz-maps" class="pill-link" href="#" target="_blank">📍 Cómo llegar</a>
        <a id="biz-ig" class="pill-link" href="#" target="_blank">📸 Instagram</a>
      </div>

      <div class="hours-box" id="biz-hours"></div>
    </div>
  </header>

  <main>
    <div class="categories" id="categories"></div>
    <div class="service-list" id="service-list">
      <div class="empty-msg">Cargando servicios...</div>
    </div>
  </main>

  <!-- Modal Reserva -->
  <div class="modal-backdrop" id="book-modal" onclick="closeOnBackdrop(event)">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2 class="modal-title">Solicitar turno</h2>
      <div class="modal-service-box" id="m-service-info"></div>

      <label class="field-label">Tu nombre</label>
      <input type="text" id="client-name" class="form-field" placeholder="Ej: Lucas" />

      <label class="field-label">Día preferido</label>
      <input type="date" id="client-date" class="form-field" />

      <label class="field-label">Franja horaria</label>
      <div class="slots">
        <button class="slot-btn active" onclick="selectSlot('Mañana', this)">Mañana</button>
        <button class="slot-btn" onclick="selectSlot('Tarde', this)">Tarde</button>
        <button class="slot-btn" onclick="selectSlot('Noche', this)">Noche</button>
      </div>

      <label class="field-label">Comentario (opcional)</label>
      <input type="text" id="client-note" class="form-field" placeholder="Ej: prefiero después de las 17hs" />

      <button class="btn-wsp" onclick="sendWhatsApp()">Confirmar turno por WhatsApp</button>
    </div>
  </div>

  <script>
    /* =======================================================
       CONFIGURACIÓN DEL CLIENTE (editás solo esto)
       ======================================================= */
    const CONFIG = {
      nombreNegocio: "BLACKBLADE BARBERÍA",
      subtitulo: "Cortes clásicos, fade y perfilado de barba",
      logo: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=300&q=80",
      horarios: "🕒 Mar a Sáb 10:00 a 20:00 • 📍 Palermo, CABA",
      linkMaps: "https://maps.google.com/?q=Palermo+Buenos+Aires",
      linkInstagram: "https://instagram.com/",
      whatsapp: "5491112345678",
      colorAcento: "#18181b",
      // Pegá acá el link CSV de Google Sheets (vacío = usa servicios de muestra)
      sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSgyXC8Ud-Y5m6Lx9no5I4vPS3IcnxrO60W0M9bwHlxBnFidhwQi7Ew4_JjK9TrZFZ7xK8WD6wbuVn0/pub?output=csv"
    };

    const DEMO_SERVICIOS = [
      {
        id: 1,
        nombre: "Corte + Fade",
        categoria: "Cabello",
        precio: 14000,
        duracion: "45 min",
        descripcion: "Degradé a navaja o máquina, lavado y peinado con producto."
      },
      {
        id: 2,
        nombre: "Corte + Barba Completo",
        categoria: "Combos",
        precio: 19500,
        duracion: "60 min",
        descripcion: "Corte a elección, perfilado de barba con toalla caliente y bálsamo."
      },
      {
        id: 3,
        nombre: "Perfilado de Barba",
        categoria: "Barba",
        precio: 8500,
        duracion: "25 min",
        descripcion: "Diseño y emprolijado con navaja y aceites hidratantes."
      },
      {
        id: 4,
        nombre: "Corte Clásico a Tijera",
        categoria: "Cabello",
        precio: 15000,
        duracion: "45 min",
        descripcion: "Corte tradicional ejecutado íntegramente a tijera."
      },
      {
        id: 5,
        nombre: "Cejas",
        categoria: "Extras",
        precio: 4000,
        duracion: "15 min",
        descripcion: "Limpieza y perfilado natural a navaja."
      }
    ];

    let SERVICIOS = [];
    let activeCategory = "Todos";
    let selectedService = null;
    let selectedSlot = "Mañana";

    const formatPrice = (num) => "$" + Number(num || 0).toLocaleString("es-AR");

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (c === '"' && inQuotes && next === '"') { cell += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { row.push(cell.trim()); cell = ""; }
        else if ((c === '\n' || c === '\r') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(cell.trim());
          if (row.some(v => v !== "")) rows.push(row);
          row = []; cell = "";
        } else { cell += c; }
      }
      if (cell.length || row.length) {
        row.push(cell.trim());
        if (row.some(v => v !== "")) rows.push(row);
      }
      return rows;
    }

    async function loadServices() {
      if (!CONFIG.sheetCsvUrl) {
        SERVICIOS = DEMO_SERVICIOS;
        renderCategories();
        renderServices();
        return;
      }

      try {
        const res = await fetch(CONFIG.sheetCsvUrl);
        const rows = parseCSV(await res.text());
        if (rows.length < 2) throw new Error("Planilla vacía");

        const headers = rows[0].map(h => h.toLowerCase().trim());
        const idx = (name) => headers.indexOf(name);

        SERVICIOS = rows.slice(1).map((cols, i) => {
          const activo = idx("activo") >= 0 ? (cols[idx("activo")] || "si").toLowerCase() : "si";
          if (activo === "no" || activo === "false" || activo === "0") return null;

          return {
            id: i + 1,
            nombre: cols[idx("nombre")] || "Servicio",
            categoria: cols[idx("categoria")] || "General",
            precio: Number((cols[idx("precio")] || "0").replace(/[^0-9]/g, "")) || 0,
            duracion: idx("duracion") >= 0 ? (cols[idx("duracion")] || "") : "",
            descripcion: idx("descripcion") >= 0 ? (cols[idx("descripcion")] || "") : ""
          };
        }).filter(Boolean);

        renderCategories();
        renderServices();
      } catch (err) {
        console.error(err);
        document.getElementById("service-list").innerHTML =
          `<div class="empty-msg">No se pudieron cargar los servicios. Revisá el link CSV.</div>`;
      }
    }

    function init() {
      document.title = CONFIG.nombreNegocio + " | Turnos";
      document.getElementById("biz-logo").src = CONFIG.logo;
      document.getElementById("biz-name").textContent = CONFIG.nombreNegocio;
      document.getElementById("biz-sub").textContent = CONFIG.subtitulo;
      document.getElementById("biz-hours").textContent = CONFIG.horarios;
      document.getElementById("biz-maps").href = CONFIG.linkMaps;
      document.getElementById("biz-ig").href = CONFIG.linkInstagram;
      document.getElementById("biz-wsp").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("Hola! Quería hacer una consulta.")}`;
      document.documentElement.style.setProperty("--acento", CONFIG.colorAcento);

      // Fecha mínima = hoy
      const today = new Date().toISOString().split("T")[0];
      const dateInput = document.getElementById("client-date");
      dateInput.min = today;
      dateInput.value = today;

      loadServices();
    }

    function renderCategories() {
      const cats = ["Todos", ...new Set(SERVICIOS.map(s => s.categoria))];
      document.getElementById("categories").innerHTML = cats.map(cat => `
        <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat.replace(/'/g, "\\'")}')">${cat}</button>
      `).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderServices();
    }

    function renderServices() {
      const filtered = activeCategory === "Todos"
        ? SERVICIOS
        : SERVICIOS.filter(s => s.categoria === activeCategory);

      const list = document.getElementById("service-list");
      if (!filtered.length) {
        list.innerHTML = `<div class="empty-msg">No hay servicios en esta categoría.</div>`;
        return;
      }

      list.innerHTML = filtered.map(s => `
        <div class="service-card">
          <div class="service-info">
            <div class="service-cat">${s.categoria}</div>
            <h3 class="service-name">${s.nombre}</h3>
            ${s.descripcion ? `<p class="service-desc">${s.descripcion}</p>` : ""}
            <div class="service-meta">
              <span class="service-price">${formatPrice(s.precio)}</span>
              ${s.duracion ? `<span class="service-time">⏱ ${s.duracion}</span>` : ""}
            </div>
          </div>
          <button class="btn-book" onclick="openModal(${s.id})">Reservar</button>
        </div>
      `).join("");
    }

    function openModal(id) {
      selectedService = SERVICIOS.find(s => s.id === id);
      if (!selectedService) return;
      document.getElementById("m-service-info").innerHTML = `
        <strong>${selectedService.nombre}</strong><br/>
        <span>${formatPrice(selectedService.precio)}${selectedService.duracion ? " • " + selectedService.duracion : ""}</span>
      `;
      document.getElementById("book-modal").classList.add("open");
    }

    function closeModal() { document.getElementById("book-modal").classList.remove("open"); }
    function closeOnBackdrop(e) { if (e.target.id === "book-modal") closeModal(); }

    function selectSlot(slot, btn) {
      selectedSlot = slot;
      document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    function sendWhatsApp() {
      const nombre = document.getElementById("client-name").value.trim();
      const fecha = document.getElementById("client-date").value;
      const nota = document.getElementById("client-note").value.trim();

      let fechaFormateada = fecha;
      if (fecha) {
        const [y, m, d] = fecha.split("-");
        fechaFormateada = `${d}/${m}/${y}`;
      }

      let msg = `Hola ${CONFIG.nombreNegocio}! Quiero pedir un turno:\n\n`;
      msg += `• *Servicio:* ${selectedService.nombre} (${formatPrice(selectedService.precio)})\n`;
      if (fechaFormateada) msg += `• *Día:* ${fechaFormateada}\n`;
      msg += `• *Franja:* ${selectedSlot}\n`;
      if (nombre) msg += `• *Nombre:* ${nombre}\n`;
      if (nota) msg += `• *Nota:* ${nota}\n`;

      window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
    }

    init();
  </script>
</body>
</html>
